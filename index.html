<!DOCTYPE html>
<html>
<head>
    <title>DSA Stack Project</title>
</head>
<body bgcolor="lightblue">

    <h2>Stack: Reverse a Word</h2>
    <p>Full-Stack C Implementation</p>

    <!-- Form Controls -->
    <input type="text" id="wordInput" placeholder="Enter a word here">
    <button id="reverseBtn">Reverse Word</button>

    <!-- Output Section -->
    <div id="resultSection" style="margin-top: 20px; display: none;">
        <strong>Result:</strong>
        <span id="outputText"></span>
    </div>

    <script>
        // FIXED: Added the exact matching /api/reverseword endpoint to link up with your Python route code!
        const BACKEND_URL = "https://onrender.com";

        // Modern safe-binding event listener
        document.getElementById('reverseBtn').addEventListener('click', async () => {
            const inputField = document.getElementById('wordInput');
            const outputDisplay = document.getElementById('outputText');
            const resultBox = document.getElementById('resultSection');
            
            const textValue = inputField.value.trim();

            if (textValue === "") {
                alert("Please type a word first.");
                return;
            }

            try {
                // Perform a secure, explicit CORS network fetch request
                const response = await fetch(BACKEND_URL, {
                    method: 'POST',
                    mode: 'cors', 
                    headers: { 
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify({ text: textValue })
                });

                if (!response.ok) {
                    throw new Error(`Server responded with status: ${response.status}`);
                }

                const data = await response.json();
                
                // Render the clean C stack output onto the screen
                outputDisplay.innerText = data.reversedText;
                resultBox.style.display = 'block';

            } catch (error) {
                alert("Cannot connect to backend server.");
                console.error("Browser Console Diagnostics:", error);
            }
        }); // FIXED: Added missing closure brackets to resolve browser crash blocks
    </script>

</body>
</html>
