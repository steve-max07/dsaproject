<!DOCTYPE html>
<html>
<head>
    <title>DSA Stack Project</title>
</head>
<body bgcolor="lightblue">

    <h2>Stack: Reverse a Word</h2>
    <p>Full-Stack C Implementation</p>

    <!-- Form Controls -->
    <input type="text" id="wordInput" placeholder="Enter a word here">
    <button id="reverseBtn">Reverse Word</button>

    <!-- Output Section -->
    <div id="resultSection" style="margin-top: 20px; display: none;">
        <strong>Result:</strong>
        <span id="outputText"></span>
    </div>

    <script>
        // Change this URL later to your live deployed server address
        const BACKEND_URL = "https://dsaproject-orsg.onrender.com";

        document.getElementById('reverseBtn').onclick = async function() {
            const textValue = document.getElementById('wordInput').value.trim();

            if (textValue === "") {
                alert("Please type a word first.");
                return;
            }

            try {
                // Send data to backend wrapper
                const response = await fetch(BACKEND_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text: textValue })
                });

                const data = await response.json();
                
                // Show output received from the compiled C program
                document.getElementById('outputText').innerText = data.reversedText;
                document.getElementById('resultSection').style.display = 'block';

            } catch (error) {
                alert("Cannot connect to backend server.");
                console.error(error);
            }
        };
    </script>

</body>
</html>
